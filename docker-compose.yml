version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: apex-db
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex_retail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_retail"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-backend
    environment:
      DATABASE_URL: postgresql://apex:apex@db:5432/apex_retail
      VIDEO_DIR: /data/videos
      UPLOAD_DIR: /data/uploads
      YOLO_MODEL: yolov8n.pt
      YOLO_CONFIDENCE: "0.3"
      FPS_SKIP: "5"
      STAFF_DETECTION_METHOD: color
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
